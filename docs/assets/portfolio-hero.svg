<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Medical imaging. Measured engineering.</title>
  <desc id="hero-description">A research-to-review machine learning systems case study for knee MRI. Project scope: 4,349 development studies, 59 scanner groups, and a CPU review demo. An abstract stack of outlined data cards decorates the right side.</desc>
