<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Private research, public review</title>
  <desc id="architecture-description">Two separate workflows. In the private AWS research lane, MRI ingest flows to model experiments and then aggregate evidence. In the public review lane, synthetic data flows to a validated CPU pipeline and then a review report. Only sanitized aggregate evidence crosses the privacy boundary into the review report. Raw MRI, identifiers, predictions for individual studies, and model weights remain private.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627782" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#147D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="740" rx="24" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="60" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#182F43">Private research, public review.</text>
    <text x="56" y="98" font-size="20" fill="#485D67">Separate workflows. An explicit evidence boundary.</text>
    <rect x="40" y="135" width="1120" height="218" rx="16" fill="#FFFFFF" stroke="#D7DED9"/>
    <rect x="64" y="158" width="230" height="30" rx="6" fill="#182F43"/>
    <text x="79" y="178" font-size="13" font-weight="700" letter-spacing="1.1" fill="#FFFFFF">PRIVATE RESEARCH · AWS</text>
    <text x="318" y="179" font-size="17" fill="#485D67">Canonical data and experiments</text>
    <g>
      <rect x="64" y="211" width="304" height="114" rx="12" fill="#F7F5EF" stroke="#D7DED9"/>
      <text x="86" y="247" font-size="25" font-weight="700" fill="#182F43">MRI ingest</text>
      <text x="86" y="278" font-size="18" fill="#485D67">DICOM + metadata</text>
      <text x="86" y="303" font-size="17" fill="#485D67">Restricted study-level inputs</text>
      <path d="M382 267 H433" fill="none" stroke="#627782" stroke-width="2" marker-end="url(#arrow-navy)"/>
      <rect x="448" y="211" width="304" height="114" rx="12" fill="#F7F5EF" stroke="#D7DED9"/>
      <text x="470" y="247" font-size="25" font-weight="700" fill="#182F43">Model experiments</text>
      <text x="470" y="278" font-size="18" fill="#485D67">Grouped validation</text>
      <text x="470" y="303" font-size="17" fill="#485D67">Checkpoints remain private</text>
      <path d="M766 267 H817" fill="none" stroke="#627782" stroke-width="2" marker-end="url(#arrow-navy)"/>
      <rect x="832" y="211" width="304" height="114" rx="12" fill="#F7F5EF" stroke="#D7DED9"/>
      <text x="854" y="247" font-size="25" font-weight="700" fill="#182F43">Aggregate evidence</text>
      <text x="854" y="278" font-size="18" fill="#485D67">Metrics + uncertainty</text>
      <text x="854" y="303" font-size="17" fill="#485D67">Public-safe summaries</text>
    </g>
    <path d="M56 399 H1144" fill="none" stroke="#9DB3AD" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="56" y="383" width="208" height="32" rx="5" fill="#F7F5EF"/>
    <text x="64" y="404" font-size="14" font-weight="700" letter-spacing="1.3" fill="#35615C">PRIVACY BOUNDARY</text>
    <rect x="686" y="379" width="270" height="40" rx="8" fill="#EAF1EC" stroke="#BCD2C7"/>
    <text x="707" y="405" font-size="18" font-weight="700" fill="#225F59">Aggregate evidence only</text>
    <rect x="40" y="446" width="1120" height="218" rx="16" fill="#EAF1EC" stroke="#C6D9CE"/>
    <rect x="64" y="469" width="240" height="30" rx="6" fill="#147D75"/>
    <text x="79" y="489" font-size="13" font-weight="700" letter-spacing="1.1" fill="#FFFFFF">PUBLIC REVIEW · CPU DEMO</text>
    <text x="328" y="490" font-size="17" fill="#485D67">Inspectable code and reproducible outputs</text>
    <g>
      <rect x="64" y="522" width="304" height="114" rx="12" fill="#FFFFFF" stroke="#C6D9CE"/>
      <text x="86" y="558" font-size="25" font-weight="700" fill="#182F43">Synthetic data</text>
      <text x="86" y="589" font-size="18" fill="#485D67">Generated review fixtures</text>
      <text x="86" y="614" font-size="17" fill="#485D67">No patient records</text>
      <path d="M382 578 H433" fill="none" stroke="#147D75" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <rect x="448" y="522" width="304" height="114" rx="12" fill="#FFFFFF" stroke="#C6D9CE"/>
      <text x="470" y="558" font-size="25" font-weight="700" fill="#182F43">Validated pipeline</text>
      <text x="470" y="589" font-size="18" fill="#485D67">CPU-executable checks</text>
      <text x="470" y="614" font-size="17" fill="#485D67">Reproducible test outputs</text>
      <path d="M766 578 H817" fill="none" stroke="#147D75" stroke-width="2" marker-end="url(#arrow-teal)"/>
      <rect x="832" y="522" width="304" height="114" rx="12" fill="#FFFFFF" stroke="#C6D9CE"/>
      <text x="854" y="558" font-size="25" font-weight="700" fill="#182F43">Review report</text>
      <text x="854" y="589" font-size="18" fill="#485D67">Inspectable results</text>
      <text x="854" y="614" font-size="17" fill="#485D67">Evidence and limitations</text>
    </g>
    <path d="M984 326 V508" fill="none" stroke="#147D75" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
    <circle cx="984" cy="353" r="4" fill="#147D75"/>
    <text x="56" y="705" font-size="17" fill="#485D67">MRI, identifiers, individual-study predictions, and weights stay in the private workspace.</text>
  </g>
</svg>
