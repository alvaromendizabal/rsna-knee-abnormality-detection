name: Publication checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify maintained source, final evidence and publication boundaries
        run: |
          python -S tools/public_quality.py
          python tools/check_publication_boundary.py
  reproducible-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-review.lock
      - name: Install the hash-locked public stack
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-review.lock
          python -m pip check
      - name: Test every retained component, including real DICOM decoding
        run: |
          python -m pytest -q
          python examples/run_public_review.py
          python -O scripts/verify_review_notebook.py
      - name: Prove pause, verified recovery and unchanged prediction reuse
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'public-demo'
          command = [sys.executable, 'examples/run_public_pipeline.py', '--output', str(out)]
          def run(extra=()):
              subprocess.run(command + list(extra), check=True, timeout=180)
              return json.loads((out / 'results.json').read_text())
          first = run(('--stop-after-fold', '1'))
          if first['status'] != 'PAUSED' or first['completed_folds'] != 1:
              raise RuntimeError('A single completed fold must be committed before pausing')
          if first['execution'] != {'reused_folds': 0, 'fitted_folds': 1}:
              raise RuntimeError('Incorrect pause accounting')
          resumed = run()
          total = resumed['total_folds']
          if resumed['status'] != 'COMPLETE' or resumed['completed_folds'] != total:
              raise RuntimeError('Resume did not complete the frozen fold plan')
          if resumed['execution'] != {'reused_folds': 1, 'fitted_folds': total - 1}:
              raise RuntimeError('The committed fold was not independently verified and reused')
          repeated = run()
          if repeated['status'] != 'COMPLETE' or repeated['execution'] != {'reused_folds': total, 'fitted_folds': 0}:
              raise RuntimeError('An unchanged rerun unexpectedly fitted models')
          digest = hashlib.sha256((out / 'synthetic_predictions.csv').read_bytes()).hexdigest()
          if digest != repeated['predictions_sha256'] or digest != resumed['predictions_sha256']:
              raise RuntimeError('Verified predictions changed across reuse')
          if repeated['metrics'] != resumed['metrics']:
              raise RuntimeError('Verified metrics changed across reuse')
          print('PUBLIC_PIPELINE_PAUSE_RESUME_AND_EXACT_REUSE_VERIFIED')
      - name: Execute and independently reopen the final aggregate notebook
        run: |
          python scripts/execute_review_notebook.py --output "$RUNNER_TEMP/rsna-review/context-evaluation.ipynb"
          python scripts/verify_review_notebook.py --notebook "$RUNNER_TEMP/rsna-review/context-evaluation.ipynb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-pipeline-demo
          path: |
            ${{ runner.temp }}/public-demo/results.json
            ${{ runner.temp }}/public-demo/report.html
            ${{ runner.temp }}/public-demo/synthetic_predictions.csv
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-context-evaluation
          path: ${{ runner.temp }}/rsna-review/context-evaluation.ipynb
          if-no-files-found: error
          retention-days: 14
