name: Publication checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run dependency-free publication tests
        run: |
          python -m unittest discover -s tests -p 'test_current_frontier.py'
          python -m unittest discover -s tests -p 'test_anatomy_qualification.py'
          python -m unittest discover -s tests -p 'test_winner_transfer.py'
          python -m unittest discover -s tests -p 'test_employer_portfolio.py'

      - name: Verify publication boundary and current frontier
        run: |
          python tools/check_publication_boundary.py
          python tools/check_current_frontier.py

  reproducible-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-review.lock

      - name: Install and verify public review dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-review.lock
          python -m pip check

      - name: Run complete public tests and synthetic example
        run: |
          python -m pytest -q
          python examples/run_public_review.py
          python -O scripts/verify_review_notebook.py

      - name: Pause public pipeline after one committed fold
        run: |
          python examples/run_public_pipeline.py --output "$RUNNER_TEMP/public-demo" --stop-after-fold 1
          python - "$RUNNER_TEMP/public-demo/results.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["status"] == "PAUSED"
          assert result["completed_folds"] == 1
          assert result["execution"] == {"reused_folds": 0, "fitted_folds": 1}
          PY

      - name: Resume the public pipeline and fit remaining folds
        run: |
          python examples/run_public_pipeline.py --output "$RUNNER_TEMP/public-demo"
          python - "$RUNNER_TEMP/public-demo/results.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["status"] == "COMPLETE"
          assert result["completed_folds"] == result["total_folds"]
          assert result["execution"] == {"reused_folds": 1, "fitted_folds": result["total_folds"] - 1}
          PY
          cp "$RUNNER_TEMP/public-demo/results.json" "$RUNNER_TEMP/public-demo-completed.json"

      - name: Verify complete rerun reuses every fold and preserves predictions
        run: |
          python examples/run_public_pipeline.py --output "$RUNNER_TEMP/public-demo"
          python - "$RUNNER_TEMP/public-demo" "$RUNNER_TEMP/public-demo-completed.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          output = Path(sys.argv[1])
          previous = json.loads(Path(sys.argv[2]).read_text())
          current = json.loads((output / "results.json").read_text())
          assert current["status"] == "COMPLETE"
          assert current["execution"] == {"reused_folds": current["total_folds"], "fitted_folds": 0}
          assert current["metrics"] == previous["metrics"]
          actual_sha = hashlib.sha256((output / "synthetic_predictions.csv").read_bytes()).hexdigest()
          assert actual_sha == current["predictions_sha256"] == previous["predictions_sha256"]
          print("PUBLIC_PIPELINE_RESUME_VERIFIED")
          PY

      - name: Execute and verify saved review notebooks
        run: |
          python scripts/execute_review_notebook.py --notebook 12 --output "$RUNNER_TEMP/rsna-review/12.ipynb"
          python scripts/execute_review_notebook.py --notebook 13 --output "$RUNNER_TEMP/rsna-review/13.ipynb"
          python scripts/execute_review_notebook.py --notebook 14 --output "$RUNNER_TEMP/rsna-review/14.ipynb"

      - name: Preserve public demo results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-pipeline-demo
          path: |
            ${{ runner.temp }}/public-demo/results.json
            ${{ runner.temp }}/public-demo/report.html
            ${{ runner.temp }}/public-demo/synthetic_predictions.csv
          retention-days: 14
          if-no-files-found: error

      - name: Preserve executed notebooks for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-review-notebooks
          path: ${{ runner.temp }}/rsna-review/*.ipynb
          retention-days: 14
          if-no-files-found: error
