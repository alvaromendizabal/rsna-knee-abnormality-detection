name: Publication checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dependency-free publication tests
        run: |
          python -m unittest discover -s tests -p 'test_current_frontier.py'
          python -m unittest discover -s tests -p 'test_anatomy_qualification.py'

      - name: Verify publication boundary
        run: python tools/check_current_frontier.py
