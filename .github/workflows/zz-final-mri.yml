name: Curate and verify final MRI review
on:
  push:
    branches: [cleanup/final-mri-20261018]
    paths: [.github/workflows/zz-final-mri.yml]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply the inspected final component inventory
        run: |
          test "$(git rev-parse origin/main)" = 080f5e5dfcc70439a2e95aafa7cabf9dfb42dd30
          python .cleanup/curate.py
          git rm -rf .cleanup
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-review.lock
          python -m pip check
      - name: Execute and reopen the final notebook before testing every retained component
        run: |
          python scripts/execute_review_notebook.py --output notebooks/01_context_evaluation.ipynb
          python -m pytest -q
          python -O scripts/verify_review_notebook.py
          python -B -S review/run.py --render
          git add -A
          python tools/check_publication_boundary.py
          python -B -S review/run.py --output "$RUNNER_TEMP/public-review"
          python -B -S review/run.py --output "$RUNNER_TEMP/public-review" --check
      - name: Publish source only; CI workflow changes use the authorized connector
        run: |
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Retire unrelated MRI experiments; retain final context evidence and tested public contracts'
          git push origin HEAD:cleanup/final-mri-20261018
          git archive --format=zip --output="$RUNNER_TEMP/public-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/public-source-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-mri-source
          path: |
            ${{ runner.temp }}/public-source.zip
            ${{ runner.temp }}/public-source-commit.txt
          if-no-files-found: warn
          retention-days: 3
